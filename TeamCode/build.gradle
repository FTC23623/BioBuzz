apply plugin: 'com.android.application'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply from: 'quality.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

dependencies {
    implementation project(':FtcRobotController')
}

// Match build (docs/decisions/0053): leaves every OpMode listed in match-build-excludes.txt
// out of the app, so the Driver Station shows only the match autos and HyDrive. Turn it on
// any of these ways; matchBuild=false (gradle.properties, the default) is off:
//
//     command line:    ./gradlew :TeamCode:installDebug -PmatchBuild
//     Android Studio:  gradle.properties: matchBuild=true, then Run as usual
//                      (or Settings > Build, Execution, Deployment > Compiler >
//                      Command-line Options: -PmatchBuild)
//
// INIT on the Driver Station says which build is on the robot. The unit tests need every
// OpMode, so they don't run in a match build.
def matchBuildSetting = project.findProperty('matchBuild')
def matchBuild = matchBuildSetting != null && matchBuildSetting.toString().trim() != 'false'

android {
    buildFeatures {
        buildConfig true
    }
    defaultConfig {
        buildConfigField 'boolean', 'MATCH_BUILD', matchBuild.toString()
    }
}

if (matchBuild) {
    def excluded = file('match-build-excludes.txt').readLines()
            .collect { it.trim() }
            .findAll { it && !it.startsWith('#') }
    android.sourceSets.main.java.exclude(excluded.collect { "**/opMode/${it}.java".toString() })
    println "MATCH BUILD: leaving out ${excluded.size()} OpModes (match-build-excludes.txt)"
    gradle.taskGraph.whenReady { graph ->
        if (graph.allTasks.any { it.project == project && it.name.contains('UnitTest') }) {
            throw new GradleException('The tests need every OpMode: run them without -PmatchBuild.')
        }
    }
}
